name: CAPM2 Hourly Crash Watch

on:
  schedule:
    # Every hour, every day. Wasteful-looking but harmless: the script
    # itself calls Alpaca's clock endpoint and no-ops immediately
    # outside market hours -- same "safe to over-schedule" design as
    # the old Windows Task Scheduler version.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Truly hourly while the market is open (changed 2026-11-23): GitHub only started ~1 of the 24 hourly slots per market
# day inside market hours (W42-W47). Each run now keeps checking every 60 min while the market is open (max 6 checks,
# ~5 h), so one late-started run covers the rest of the session. Same script, same crash rule; runs are serialised
# so two loops never check at the same time.
concurrency:
  group: capm2-crash-watch
  cancel-in-progress: false

jobs:
  crash_watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ops/requirements_capm2.txt

      - name: Run crash watch
        env:
          ACTIVE_BROKER: alpaca
          CAPM2_US_KEY_ID: ${{ secrets.CAPM2_US_KEY_ID }}
          CAPM2_US_SECRET_KEY: ${{ secrets.CAPM2_US_SECRET_KEY }}
          CAPM2_SE_KEY_ID: ${{ secrets.CAPM2_SE_KEY_ID }}
          CAPM2_SE_SECRET_KEY: ${{ secrets.CAPM2_SE_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(python -u ops/capm2_hourly_crash_watch.py 2>&1); rc=$?; echo "$out"
            [ $rc -ne 0 ] && exit $rc
            # stop when the market is closed (the script says so for both accounts) or after the 6th check
            echo "$out" | grep -q "Market closed" && break
            [ $i -lt 6 ] && sleep 3600
          done

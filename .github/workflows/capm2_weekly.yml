name: CAPM2 Weekly Rebalance

on:
  schedule:
    # 15:00 UTC Monday AND Tuesday (changed 2026-10-08). 15:00 UTC is inside US market hours all year
    # (11:00 New York in summer time, 10:00 in winter time); the old 14:00 UTC would have run 30 min BEFORE
    # the open after the US clock change on 2026-11-01. ops/capm2_should_run.py lets only one run per week
    # through: Monday, or Tuesday when Monday was a market holiday.
    - cron: "0 15 * * 1,2"
    # Second slot (added 2026-10-12): GitHub often starts scheduled jobs hours late (2026-10-05: 7h20m late,
    # after the close). The gate lets a run through only if no run has rebalanced yet this week, so extra
    # slots are harmless and a late/missed Monday is caught up the same day or on Tuesday.
    - cron: "30 17 * * 1,2"
    # More slots (added 2026-11-09): three weeks in a row the rebalance only got through on TUESDAY minutes before the
    # close (10-20 19:01, 10-27 19:53 = 7 min before, 11-03 20:47 = 13 min before), because GitHub started Monday slots
    # 6-8 h late (after the close). Odd minutes avoid GitHub's busiest top-of-hour queue. Harmless: the gate still lets
    # only one run per week through, and the concurrency group below serialises runs.
    - cron: "47 14 * * 1,2"
    - cron: "19 16 * * 1,2"
    - cron: "53 18 * * 1,2"
    # Early slots (added 2026-11-16): in W46 GitHub started ALL ten Mon/Tue slots 5-9 h late (first at 23:35 UTC,
    # after the close) and the week was skipped. These start in the morning; the gate WAITS (max 5h15m) until 10 min
    # after the open, so on time = waits, hours late = lands in market hours. Gate rules unchanged (Mon, or Tue
    # catch-up; one rebalance per week; concurrency group serialises runs).
    - cron: "47 9 * * 1,2"
    - cron: "41 10 * * 1,2"
    - cron: "7 12 * * 1,2"
    # Chain slot (added 2026-11-23): on 11-16 the 09:47 slot started at 19:52 (10 h late). A slot just after midnight
    # survives even a 14 h delay; when it starts on time the gate sleeps 5h15m and re-dispatches this workflow
    # (input chain=1) until the open is close enough to wait for. Same gate rules for every link.
    - cron: "23 0 * * 1,2"
  workflow_dispatch:      # manual run from the Actions tab = forced RUN; chain=1 = automatic next link (normal gate)
    inputs:
      chain:
        required: false
        default: ""

permissions:
  contents: read
  actions: write         # the gate reads this workflow's run history; a CHAIN link dispatches this workflow

concurrency:
  group: capm2-weekly
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the gate may sleep up to 5h15m until the open (early slots)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ops/requirements_capm2.txt

      - name: Market-open gate (read-only)
        id: gate
        env:
          CAPM2_US_KEY_ID: ${{ secrets.CAPM2_US_KEY_ID }}
          CAPM2_US_SECRET_KEY: ${{ secrets.CAPM2_US_SECRET_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.chain != '1' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest tests.test_should_run -q
          out=$(python ops/capm2_should_run.py); echo "$out"
          # decision = LAST line only (fixed 2026-11-24: the wait/chain paths print a status line first, so matching
          # the whole output never saw RUN/CHAIN -> a waited run would never rebalance and a chain never re-started)
          d=$(printf '%s\n' "$out" | tail -n 1)
          case "$d" in RUN*) echo "go=1" >> $GITHUB_OUTPUT ;; *) echo "go=0" >> $GITHUB_OUTPUT ;; esac
          case "$d" in CHAIN*) echo "chain=1" >> $GITHUB_OUTPUT ;; esac

      - name: Start the next link (started too early for the open)
        if: steps.gate.outputs.chain == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run capm2_weekly.yml --ref main -f chain=1

      - name: Run weekly reallocation
        if: steps.gate.outputs.go == '1'
        env:
          ACTIVE_BROKER: alpaca
          CAPM2_US_KEY_ID: ${{ secrets.CAPM2_US_KEY_ID }}
          CAPM2_US_SECRET_KEY: ${{ secrets.CAPM2_US_SECRET_KEY }}
          CAPM2_SE_KEY_ID: ${{ secrets.CAPM2_SE_KEY_ID }}
          CAPM2_SE_SECRET_KEY: ${{ secrets.CAPM2_SE_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u ops/capm2_weekly_rebalance.py
